        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /staff/pickups/catalog:
    get:
      summary: Thực đơn khả dụng để tạo đơn tại quầy
      description: "JWT STAFF/ADMIN. Cùng nguồn menu public và tồn kho hiện tại; categories/products/toppings."
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /staff/pickups/{id}/payments:
    post:
      summary: Ghi nhận đã thu tiền đơn mang đi
      description: "JWT STAFF/ADMIN. Header Idempotency-Key 8–64 ký tự. Body strict {amount nguyên >=0,method CASH/BANK_TRANSFER/OTHER,expectedVersion,note?}. Thu một phần hoặc đủ; đủ chuyển PENDING/PAID. Số tiền không vượt dư nợ; 0 chỉ cho đơn 0đ. Không yêu cầu payment claim của bàn. Thu/ca/audit/outbox cùng transaction; replay không thu hai lần."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /staff/pickups/{id}/status:
    patch:
      summary: Chuyển công đoạn hoặc xác nhận khách đã nhận
      description: "JWT STAFF/ADMIN. Body strict {status,expectedVersion}. Chỉ PAID; PENDING→CONFIRMED→PREPARING→READY→SERVED. Đặt trước không pha sớm hơn giờ hẹn trừ 15 phút. SERVED là giao khách thực tế: COLLECTED, WorkActivity, tích điểm và Bill snapshot cùng transaction. Không chuyển đơn đã NO_SHOW/COLLECTED."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /staff/pickups/{id}/refund:
    post:
      summary: Xác nhận đã hoàn toàn bộ tiền và hủy trước pha chế
      description: "JWT STAFF/ADMIN. Body strict {expectedVersion,amount,method,reason,refundConfirmed:true}. Đã hoàn thủ công, không gọi ngân hàng. Chỉ AWAITING_PAYMENT/PENDING/CONFIRMED; kiểm tổng tất cả khoản thu SUCCESS, hoàn và trả giữ/ưu đãi đúng một lần."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /staff/pickups/{id}/no-show:
    post:
      summary: Nhân viên ghi nhận khách không đến
      description: "JWT STAFF/ADMIN. Body strict {expectedVersion,reason}. Chỉ sau giờ hẹn 30 phút, TAKEAWAY sau tạo 60 phút. Chưa pha/chưa thu thì hủy và trả giữ; đã thu/chưa pha phải hoàn trước. Đã pha giữ tiêu hao/khoản thu, không tích điểm, tạo Bill snapshot, outcome NO_SHOW và loại khỏi KDS. Retry không thêm giao dịch. Không tự chạy định kỳ."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
