      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /admin/pickups/{id}/payments:
    post:
      summary: Ghi nhận đã thu tiền đơn mang đi
      description: "JWT ADMIN. Header Idempotency-Key 8–64 ký tự. Body strict {amount nguyên >=0,method CASH/BANK_TRANSFER/OTHER,expectedVersion,note?}. Thu một phần hoặc đủ; đủ chuyển PENDING/PAID. Số tiền không vượt dư nợ; 0 chỉ cho đơn 0đ. Không yêu cầu payment claim của bàn. Thu/ca/audit/outbox cùng transaction; replay không thu hai lần."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /admin/pickups/{id}/status:
    patch:
      summary: Chuyển công đoạn hoặc xác nhận khách đã nhận
      description: "JWT ADMIN. Body strict {status,expectedVersion}. Chỉ PAID; PENDING→CONFIRMED→PREPARING→READY→SERVED. Đặt trước không pha sớm hơn giờ hẹn trừ 15 phút. SERVED là giao khách thực tế: COLLECTED, WorkActivity, tích điểm và Bill snapshot cùng transaction. Không chuyển đơn đã NO_SHOW/COLLECTED."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /admin/pickups/{id}/refund:
    post:
      summary: Xác nhận đã hoàn toàn bộ tiền và hủy trước pha chế
      description: "JWT ADMIN. Body strict {expectedVersion,amount,method,reason,refundConfirmed:true}. Đã hoàn thủ công, không gọi ngân hàng. Chỉ AWAITING_PAYMENT/PENDING/CONFIRMED; kiểm tổng tất cả khoản thu SUCCESS, hoàn và trả giữ/ưu đãi đúng một lần."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /admin/pickups/{id}/no-show:
    post:
      summary: Nhân viên ghi nhận khách không đến
      description: "JWT ADMIN. Body strict {expectedVersion,reason}. Chỉ sau giờ hẹn 30 phút, TAKEAWAY sau tạo 60 phút. Chưa pha/chưa thu thì hủy và trả giữ; đã thu/chưa pha phải hoàn trước. Đã pha giữ tiêu hao/khoản thu, không tích điểm, tạo Bill snapshot, outcome NO_SHOW và loại khỏi KDS. Retry không thêm giao dịch. Không tự chạy định kỳ."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /admin/workforce/copy-preview:
    post:
      summary: Admin xem trước bản sao lịch tuần, không ghi dữ liệu
      description: 'Body strict {from,targetFrom} YYYY-MM-DD. Tuần đích sau nguồn ít nhất 7 ngày và cùng thứ; tối đa 200 ca bắt đầu trong tuần nguồn, bỏ ca hủy. Trả shifts, conflicts và snapshot; kiểm tài khoản khóa/xóa, ca đích ở tương lai và trùng lịch. Không sao chép chấm công/KDS.'
      responses:
        '200': { description: 'from,targetFrom,snapshot,shifts,conflicts' }
        '403': { description: Chỉ Admin }
        '422': { description: Tuần không hợp lệ hoặc nguồn rỗng/quá lớn }
  /admin/workforce/copy:
    post:
      summary: Admin xác nhận sao chép lịch theo bản xem trước
      description: 'Body strict {from,targetFrom,snapshot,requestId}; requestId UUID. Transaction kiểm lại nguồn/version, tài khoản và lịch đích, tạo tất cả hoặc không tạo ca nào, kèm audit và bản ghi replay. Mất phản hồi thử lại đúng payload trả kết quả cũ. Lịch sao chép reset trạng thái SCHEDULED, version 0 và giờ công rỗng.'
      responses:
        '200': { description: 'count,ids,targetFrom hoặc replay' }
        '403': { description: Chỉ Admin }
        '409': { description: Nguồn đổi, đích trùng/không còn hợp lệ hoặc requestId xung đột }
  /staff/workforce/export:
    get:
      summary: Xuất CSV bảng công và hiệu suất riêng của người đăng nhập
      description: 'JWT STAFF/ADMIN, from YYYY-MM-DD bắt buộc. CSV UTF-8 BOM, giờ Việt Nam, tổng hợp tuần và chi tiết ca/giờ gốc/điều chỉnh; chống công thức spreadsheet, không trả dữ liệu người khác. Cache-Control no-store.'
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: 'text/csv attachment bang-cong-YYYY-MM-DD.csv' }
        '401': { description: Cần đăng nhập }
        '422': { description: Ngày/query không hợp lệ }
  /admin/workforce/export:
    get:
      summary: Admin xuất CSV bảng công và hiệu suất toàn bộ
      description: 'CSV tổng hợp tuần và chi tiết lịch/chấm công; cùng phạm vi tuần với GET /admin/workforce. Tổng giờ thực tế cắt theo tuần, chi tiết hiển thị cả ca; không tính lương. UTF-8 BOM, chống công thức spreadsheet, Cache-Control no-store.'
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: 'text/csv attachment bang-cong-YYYY-MM-DD.csv' }
        '403': { description: Chỉ Admin }
