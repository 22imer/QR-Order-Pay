      {
        summary: Chuyển phiên OPEN sang bàn trống bằng transaction,
        responses:
          {
            '200': { description: Đã chuyển },
            '409': { description: Bàn đích bận hoặc version đổi },
          },
      }
  /staff/cash-shifts/current:
    get:
      {
        summary: Ca hiện tại và tổng Payment theo phương thức,
        responses: { '200': { description: OK } },
      }
  /staff/cash-shifts:
    post:
      {
        summary: Mở ca thu ngân,
        responses: { '201': { description: Đã mở }, '409': { description: Đã có ca mở } },
      }
  /staff/cash-shifts/{id}/close:
    post:
      {
        summary: Chốt tiền kiểm đếm và chênh lệch,
        responses: { '200': { description: Đã chốt }, '409': { description: Ca đã thay đổi } },
      }
  /admin/bills:
    get:
      {
        summary: Bill snapshot phân trang và lọc mã/bàn/ngày/thu ngân,
        responses: { '200': { description: OK }, '403': { description: Chỉ ADMIN } },
      }
  /admin/bills/{id}:
    get:
      {
        summary: Chi tiết snapshot để in lại,
        responses: { '200': { description: OK }, '404': { description: Không tìm thấy } },
      }
  /admin/operations/failures:
    get: { summary: Outbox FAILED và queue dead-letter, responses: { '200': { description: OK } } }
  /admin/operations/outbox/{id}/replay:
    post:
      { summary: Replay một outbox FAILED và ghi audit, responses: { '200': { description: OK } } }
  /admin/operations/jobs/{id}/replay:
    post:
      {
        summary: Replay một Redis dead-letter và ghi audit,
        responses: { '200': { description: OK } },
      }
  /admin/cash-shifts:
    get: { summary: Lịch sử đối soát ca, responses: { '200': { description: OK } } }
  /ai/recommendations/validate:
    post:
      {
        summary: Kiểm tra lại variant/topping/giá/caffeine/dairy của cấu hình AI cuối,
        description: "Cần phiên QR hoạt động hoặc cookie thành viên mc_member hợp lệ; hỗ trợ tùy chỉnh món mang đi chưa vào bàn. CSRF/rate limit giữ nguyên.",
        responses: { '200': { description: Kết quả valid, total và violations } },
      }
