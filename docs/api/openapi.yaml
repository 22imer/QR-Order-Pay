          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: 'data gồm items, total, averageRating, distribution, page, limit' }
        '403': { description: Chỉ ADMIN }
        '422': { description: Bộ lọc không hợp lệ }
  /staff/tables:
