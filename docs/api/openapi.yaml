openapi: 3.0.3
info:
  title: Fantastic cafe API
  version: 1.0.0
  description: |
    REST API cho hệ thống đặt đồ uống qua QR tích hợp AI Barista.
    - Prefix: `/api/v1`
    - Auth: JWT (Staff/Admin) + HttpOnly cookie (Guest)
    - Error envelope: `{ success: false, error: { code, message, details? }, requestId }`
    - Socket nội bộ `workforce.changed`: `{refresh:true}` qua outbox sau commit tạo/sửa/hủy/chấm/điều chỉnh/cấu hình/copy; chỉ Staff/Admin, không chứa thông tin nhân sự. Client đọc lại snapshot theo quyền, refetch khi reconnect và polling 30 giây dự phòng.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /pickups:
    get:
      summary: Danh sách đơn mang đi và đặt trước nhận tại quầy
      description: "Cookie HttpOnly mc_member; chính chủ, không cần QR. Query page mặc định 1, history=true/false mặc định false; 30 dòng/trang. Trả items,total,page,limit. Khách chỉ thấy tài khoản mình; internal tất cả. DTO có contact riêng, outcome ACTIVE/COLLECTED/NO_SHOW, version, billId."
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
    post:
      summary: Tạo hoặc replay đơn mang đi
      description: "Cookie HttpOnly mc_member; chính chủ, không cần QR. Body strict {requestId UUID,items,pickup:{fulfillmentType TAKEAWAY/PICKUP,name,phone,scheduledAt ISO offset hoặc null},voucherCode?,redeemPoints?,quoteToken?}. TAKEAWAY không giờ; PICKUP từ 15 phút tới 7 ngày. Giờ Việt Nam. Tối đa 50 dòng × 50 phần. Giá/kho/ưu đãi tính ở server. Create bắt buộc quoteToken hợp lệ, gắn owner và contact/giờ hẹn. requestId unique theo chủ yêu cầu; retry không giữ kho/điểm/lượt lần nữa. Không tạo bàn/phiên bàn. Đơn AWAITING_PAYMENT/UNPAID. Khách tối đa 3 đơn active."
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /pickups/quote:
    post:
      summary: Báo giá đơn mang đi trước khi đặt
      description: "Cookie HttpOnly mc_member; chính chủ, không cần QR. Body strict {requestId UUID,items,pickup:{fulfillmentType TAKEAWAY/PICKUP,name,phone,scheduledAt ISO offset hoặc null},voucherCode?,redeemPoints?,quoteToken?}. TAKEAWAY không giờ; PICKUP từ 15 phút tới 7 ngày. Giờ Việt Nam. Tối đa 50 dòng × 50 phần. Giá/kho/ưu đãi tính ở server. Quote không nhận quoteToken. Trả OrderQuoteResponse có chữ ký, tổng/ưu đãi/options; không ghi đơn/kho."
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /pickups/{id}/cancel:
    post:
      summary: Hủy đơn mang đi chưa pha và chưa thu
      description: "Cookie HttpOnly mc_member; chính chủ, không cần QR. Body strict {expectedVersion,reason 3–280 ký tự}. Trả giữ kho/ưu đãi trong transaction; đã thu cần refund. Retry đơn đã hủy trả trạng thái cũ."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /pickups/{id}/bill:
    get:
      summary: Đọc hóa đơn snapshot một đơn mang đi
      description: "Cookie HttpOnly mc_member; chính chủ, không cần QR. Chỉ khi COLLECTED hoặc NO_SHOW đã pha có tiền. Trả invoiceCode,title,closedAt,total,order chứa dòng món/giảm giá. Không trả tên/SĐT, payment ID hoặc nhân viên; không tính lại giá theo catalog."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: 'success/data envelope; DTO filtered, Cache-Control no-store' }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc không thể thao tác ở trạng thái hiện tại }
        '409': { description: Version thay đổi, requestId xung đột hoặc cần báo giá lại }
        '422': { description: Dữ liệu hoặc giờ nhận không hợp lệ }
  /staff/pickups:
    get:
      summary: Danh sách đơn mang đi và đặt trước nhận tại quầy
      description: "JWT STAFF/ADMIN. Query page mặc định 1, history=true/false mặc định false; 30 dòng/trang. Trả items,total,page,limit. Khách chỉ thấy tài khoản mình; internal tất cả. DTO có contact riêng, outcome ACTIVE/COLLECTED/NO_SHOW, version, billId."
      responses:
