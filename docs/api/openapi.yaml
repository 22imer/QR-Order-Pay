              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
        '401':
          description: Sai tài khoản/mật khẩu
  /categories:
    get:
      summary: Danh sách danh mục
      responses:
        '200': { description: OK }
  /products:
    get:
      summary: Danh sách món đang bán
      parameters:
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: tag
