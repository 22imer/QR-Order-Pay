openapi: 3.0.3
info:
  title: Fantastic cafe API
  version: 1.0.0
  description: |
    REST API cho hệ thống đặt đồ uống qua QR tích hợp AI Barista.
    - Prefix: `/api/v1`
    - Auth: JWT (Staff/Admin) + HttpOnly cookie (Guest)
    - Error envelope: `{ success: false, error: { code, message, details? }, requestId }`
servers:
  - url: http://localhost:4000/api/v1
paths:
  /members/register:
    post:
      summary: Đăng ký thành viên bằng tên, SĐT Việt Nam và mật khẩu; không SMS
      description: Body strict gồm name, phone, password. Mật khẩu từ 8 ký tự, tối đa 72 byte UTF-8. Set cookie HttpOnly mc_member 14 ngày, JSON không trả token/hash.
      responses:
        '201': { description: DTO member }
        '409': { description: SĐT đã đăng ký }
        '422': { description: Input không hợp lệ }
  /members/login:
    post:
      summary: Đăng nhập SĐT + mật khẩu, set cookie HttpOnly mc_member
      description: Body gồm phone, password. Chuẩn hóa +84 thành 0. Sáu lần sai khóa 15 phút; thêm Redis limiter theo IP.
      responses:
        '200': { description: DTO member }
        '401': { description: Sai thông tin hoặc tài khoản khóa }
        '429': { description: Khóa đăng nhập tạm thời hoặc rate limit }
  /members/me:
    get:
      summary: Thành viên hiện tại hoặc null và quy tắc tích/đổi điểm
      responses:
        '200': { description: member và rules }
  /members/logout:
    post:
      summary: Thu hồi phiên thành viên hiện tại và xóa cookie
      responses:
        '200': { description: OK }
  /members/password:
    post:
      summary: Đổi mật khẩu thành viên và thu hồi mọi phiên
      description: Body strict gồm currentPassword và password mới.
      responses:
        '200': { description: Đã đổi; cần đăng nhập lại }
        '401': { description: Chưa đăng nhập hoặc sai mật khẩu hiện tại }
  /members/points:
    get:
      summary: Cookie thành viên hợp lệ xem sổ điểm của chính mình; page mặc định 1, 20 dòng/trang
      responses:
        '200': { description: items, total, page; EARN/REDEEM/RETURN và balanceAfter }
        '401': { description: Cần đăng nhập thành viên }
  /admin/vouchers:
    get:
      summary: ADMIN xem 200 voucher mới nhất kèm số lượt đang giữ/đã dùng
      responses:
        '200': { description: items }
    post:
      summary: ADMIN tạo voucher FIXED/PERCENT
      description: Cấu hình strict theo voucherCreateSchema trong packages/contracts/src/promotions.ts; không tự tạo dữ liệu mẫu. Có mức đơn tối thiểu, trần giảm, thời gian, tổng lượt, điều kiện và lượt thành viên. allowPointRedemption (boolean, mặc định false) bật quyền dùng kèm điểm; giới hạn điểm tính sau voucher.
      responses:
        '201': { description: voucher DTO }
        '409': { description: Mã trùng }
  /admin/vouchers/{id}:
    patch:
      summary: ADMIN sửa cấu hình voucher với expectedVersion; không đổi mã
      responses:
        '200': { description: voucher DTO }
        '409': { description: Version đã đổi }
  /admin/members:
    get:
      summary: ADMIN tìm theo q là tên/SĐT, phân trang page, 20 dòng/trang
      responses:
        '200': { description: items, total, page; không có passwordHash/token }
  /admin/members/{id}:
    patch:
      summary: ADMIN khóa/mở/đặt lại mật khẩu thành viên, thu hồi phiên
      description: Body strict gồm expectedVersion, isActive và/hoặc password mới; không được sửa điểm.
      responses:
        '200': { description: member DTO }
        '409': { description: Version đã đổi }
  /admin/members/{id}/points:
    get:
      summary: ADMIN xem sổ điểm thành viên theo page
      responses:
        '200': { description: items, total, page }
  /admin/inventory:
    get:
      summary: ADMIN xem nguyên liệu, tồn thực, lượng giữ, cảnh báo và công thức
      responses:
        '200': { description: data gồm ingredients, recipes, products và toppings }
        '401': { description: Chưa đăng nhập }
        '403': { description: Chỉ ADMIN }
  /admin/inventory/ingredients:
    post:
      summary: ADMIN thêm nguyên liệu với tồn ban đầu bằng 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, unit]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9_-]{1,32}$' }
                name: { type: string, minLength: 1, maxLength: 100 }
                unit: { type: string, enum: [g, ml, unit] }
                lowStockThreshold:
                  { type: number, minimum: 0, maximum: 1000000000, multipleOf: 0.001, default: 0 }
      responses:
        '201': { description: data.ingredient với lượng theo đơn vị cơ sở }
        '403': { description: Chỉ ADMIN }
        '409': { description: Mã nguyên liệu đã tồn tại }
        '422': { description: Dữ liệu không hợp lệ }
  /admin/inventory/ingredients/{id}:
    patch:
      summary: ADMIN sửa tên, ngưỡng cảnh báo hoặc ngừng dùng nguyên liệu
      description: Không đổi mã/đơn vị; không ngừng nguyên liệu đang giữ cho đơn.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, lowStockThreshold, isActive, expectedVersion]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                lowStockThreshold:
                  { type: number, minimum: 0, maximum: 1000000000, multipleOf: 0.001 }
                isActive: { type: boolean }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200': { description: data.ingredient }
        '403': { description: Chỉ ADMIN }
        '409': { description: Version thay đổi hoặc còn nguyên liệu đang giữ }
        '422': { description: Dữ liệu không hợp lệ }
  /admin/inventory/ingredients/{id}/movements:
    post:
      summary: ADMIN ghi nhận nhập, xuất khác hoặc kiểm kê có lý do và chống ghi trùng
      description: Quantity theo g/ml/đơn vị; ADJUSTMENT là tổng tồn sau kiểm kê. Không được thấp hơn lượng đang giữ. Retry giữ nguyên idempotencyKey và nội dung, không yêu cầu version cũ còn khớp nếu đã ghi nhận.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, quantity, reason, expectedVersion, idempotencyKey]
              properties:
                type: { type: string, enum: [RECEIPT, ISSUE, ADJUSTMENT] }
                quantity: { type: number, minimum: 0, maximum: 1000000000, multipleOf: 0.001 }
                reason: { type: string, minLength: 3, maxLength: 280 }
                expectedVersion: { type: integer, minimum: 0 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '200': { description: data.id và data.replayed }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không có nguyên liệu }
        '409': { description: Version đổi, thiếu tồn hoặc key dùng cho nội dung khác }
        '422': { description: Dữ liệu không hợp lệ }
  /admin/inventory/movements:
    get:
      summary: ADMIN xem sổ biến động kho phân trang 30 dòng
      parameters:
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, maximum: 100000, default: 1 },
          }
        - { in: query, name: ingredientId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200':
          {
            description: data.items,
            total,
            page và limit; có lượng biến động,
            tồn sau,
            giữ sau,
            lý do,
            đơn và người thao tác,
          }
        '403': { description: Chỉ ADMIN }
  /admin/inventory/recipes/{type}/{id}:
    put:
      summary: ADMIN lưu công thức nền và công thức thay thế theo size
      description: Xem docs/inventory.md và recipeSaveSchema trong contracts. Payload gồm enabled, components, variants và expectedVersion. Component gồm ingredientId và quantity lớn hơn 0, tối đa 3 chữ số thập phân. Topping không có variants. Công thức bật cần ít nhất một nguyên liệu nền; không cho trùng nguyên liệu/size. Không sửa snapshot kho của đơn đã đặt.
      parameters:
        - {
            in: path,
            name: type,
            required: true,
            schema: { type: string, enum: [PRODUCT, TOPPING] },
          }
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, components, variants, expectedVersion]
              properties:
                enabled: { type: boolean }
                expectedVersion: { type: integer, minimum: 0 }
                components:
                  type: array
                  maxItems: 100
                  items: &inventoryComponent
                    type: object
                    additionalProperties: false
                    required: [ingredientId, quantity]
                    properties:
                      ingredientId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                      quantity:
                        {
                          type: number,
                          minimum: 0,
                          exclusiveMinimum: true,
                          maximum: 1000000000,
                          multipleOf: 0.001,
                        }
                variants:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, components]
                    properties:
                      variantId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                      components:
                        { type: array, minItems: 1, maxItems: 100, items: *inventoryComponent }
      responses:
        '200': { description: data.version mới }
        '403': { description: Chỉ ADMIN }
        '404': { description: Món/topping không tồn tại hoặc đã xóa }
        '409': { description: Version công thức đã đổi }
        '422': { description: Nguyên liệu hoặc size không hợp lệ }
  /table-displays/qr:
    get:
      summary: Lấy QR vào bàn còn hạn trong chu kỳ 60 giây
      description: Thiết bị tại bàn dùng khóa riêng. Trả data gồm tableId, tableName, url, expiresAt và serverTime (milliseconds); Cache-Control no-store. Khóa màn hình không phải vé vào bàn.
      parameters:
        - in: header
          name: X-Table-Display-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: QR có chữ ký và thời hạn }
        '403': { description: Khóa không hợp lệ hoặc đã thu hồi }
  /staff/tables/{id}/display:
    post:
      summary: STAFF hoặc ADMIN cấp lại liên kết riêng cho màn hình QR
      description: Thu hồi khóa màn hình và QR cũ ngay; giữ quyền khách đã tham gia phiên.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: data chứa tableId và url /display với khóa trong fragment }
        '403': { description: Không đủ quyền }
  /admin/tables/{id}/display:
    post:
      summary: ADMIN cấp lại liên kết riêng cho màn hình QR
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: data chứa tableId và url cấu hình màn hình }
        '403': { description: Chỉ ADMIN }
  /staff/awaiting-payments:
    get:
      summary: Đơn chưa thu tiền của phiên OPEN hoặc CHECKOUT
      responses:
        '200': { description: data.items theo staffOrderSchema, có tableName }
        '403': { description: Chỉ STAFF hoặc ADMIN }
  /staff/orders/{id}/payments:
    post:
      summary: Ghi nhận tiền thực nhận của một đơn, hỗ trợ thu từng phần
      description: Bắt buộc giữ quyền thu của phiên bàn. Thu thiếu giữ AWAITING_PAYMENT/UNPAID; đủ tiền chuyển PENDING/PAID và vào KDS. Không đóng phiên. Cùng key/payload/người thu trả khoản cũ kể cả quyền hết hạn. Chưa tích hợp cổng thanh toán.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
        - in: header
          name: X-Payment-Claim
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method, expectedVersion]
              properties:
                amount: { type: integer, minimum: 0 }
                method: { type: string, enum: [CASH, BANK_TRANSFER, OTHER] }
                expectedVersion: { type: integer, minimum: 0 }
                note: { type: string, maxLength: 280 }
      responses:
        '201': { description: Đã thu tiền }
        '200': { description: Idempotent replay }
        '409': { description: Version hoặc idempotency conflict }
        '422':
          {
            description: Số tiền vượt phần còn thiếu,
            không dương với đơn có dư nợ,
            hoặc dữ liệu không hợp lệ,
          }
  /staff/table-sessions/{id}/payment-claim:
    post:
      summary: STAFF hoặc ADMIN giữ/gia hạn quyền thu toàn phiên bàn trong 120 giây
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 16, maxLength: 128 }
      responses:
        '200':
          { description: data.expiresAt và version phiên mới; gia hạn bằng cùng token và tài khoản }
        '409': { description: Bàn đã đóng hoặc người/cửa sổ khác giữ quyền }
  /staff/table-sessions/{id}/payment-claim/release:
    post:
      summary: Trả quyền thu; chỉ tài khoản và token sở hữu được trả quyền
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 16, maxLength: 128 }
      responses:
        '200': { description: Đã xử lý; không trả quyền của người khác }
  /staff/payments:
    get:
      summary: STAFF hoặc ADMIN tra cứu khoản thu và yêu cầu điều chỉnh
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          {
            description: data.items (30/trang),
            total,
            corrections (200 yêu cầu,
            ưu tiên đang chờ),
            targets (200 đơn chờ),
          }
  /admin/payments:
    get:
      summary: ADMIN tra cứu khoản thu và hàng chờ duyệt
      responses:
        '200': { description: Cùng cấu trúc GET /staff/payments }
  /staff/payments/{id}/corrections:
    post:
      summary: STAFF hoặc ADMIN lập yêu cầu điều chỉnh một khoản thu
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              properties:
                kind: { type: string, enum: [VOID, METHOD, TRANSFER] }
                reason: { type: string, minLength: 3, maxLength: 280 }
                method:
                  {
                    type: string,
                    enum: [CASH, BANK_TRANSFER, OTHER],
                    description: Bắt buộc cho METHOD,
                  }
                targetOrderId:
                  { type: string, description: ObjectId đơn nhận, bắt buộc cho TRANSFER }
      responses:
        '201': { description: Đã lập yêu cầu chờ quản lý khác duyệt }
        '409': { description: Khoản thu đã thay đổi, đang giữ quyền thu hoặc có yêu cầu khác }
  /admin/payments/{id}/corrections:
    post:
      summary: ADMIN lập yêu cầu như STAFF; quản lý khác phải duyệt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '201': { description: 'Body và quy tắc như POST /staff/payments/{id}/corrections' }
  /admin/payment-corrections/{id}/decision:
    post:
      summary: ADMIN duyệt/từ chối yêu cầu điều chỉnh, có version guard
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, approve, note]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                approve: { type: boolean }
                note: { type: string, minLength: 3, maxLength: 280 }
      responses:
        '200': { description: Đã xử lý và ghi audit; duyệt ghi đảo/thay thế trong transaction }
        '403': { description: Người lập không tự duyệt; chỉ ADMIN được quyết định }
        '409': { description: Yêu cầu đã xử lý hoặc trạng thái khoản thu/đơn đã thay đổi }
  /staff/orders/{id}/refund:
    post:
      summary: Ghi nhận đã hoàn đủ tiền thủ công và hủy đơn chưa pha chế
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method, expectedVersion, reason, refundConfirmed]
              properties:
                amount: { type: integer, minimum: 0 }
                method: { type: string, enum: [CASH, BANK_TRANSFER, OTHER] }
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 3, maxLength: 280 }
                refundConfirmed: { type: boolean, enum: [true] }
      responses:
        '200': { description: Đơn CANCELLED và REFUNDED; ca ghi nhận tiền hoàn }
        '409': { description: Đơn đã thay đổi hoặc không thể hoàn }
  /admin/anomalies:
    get:
      summary: Trạng thái detector và cảnh báo vận hành cho ADMIN
      description: Trả bốn evaluation gần nhất, tối đa 50 alert, lịch job và thời điểm chạy. GET không kích hoạt detector hoặc LLM.
      responses:
        '200': { description: Detector state, evidence, explanation và vòng đời alert }
        '401': { description: Chưa đăng nhập }
        '403': { description: Chỉ ADMIN }
  /admin/anomalies/{id}/status:
    patch:
      summary: Xác nhận hoặc đóng cảnh báo, đồng thời ghi AuditLog
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACKNOWLEDGED, CLOSED] }
      responses:
        '200': { description: Alert đã cập nhật }
        '403': { description: Chỉ ADMIN }
        '404': { description: Alert không tồn tại hoặc transition không hợp lệ }
        '422': { description: Body không hợp lệ }
  /admin/reviews:
    get:
      summary: Danh sách đánh giá khách hàng cho ADMIN
      parameters:
        - in: query
          name: rating
          schema: { type: integer, minimum: 1, maximum: 5 }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: 'data gồm items, total, averageRating, distribution, page, limit' }
        '403': { description: Chỉ ADMIN }
        '422': { description: Bộ lọc không hợp lệ }
  /staff/tables:
    get:
      summary: Danh sách bàn cho STAFF hoặc ADMIN, không trả token/hash QR
      responses:
        '200': { description: 'data.tables gồm _id, code, name, capacity, isActive' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không đúng vai trò }
  /receipts/current:
    get:
      summary: Hóa đơn của thiết bị sau khi đóng phiên
      description: Cookie HttpOnly mc_receipt riêng, chỉ dùng cho hóa đơn và đánh giá; hết hạn 12 giờ từ lúc vào bàn. Phiên mới đọc Bill snapshot bất biến và lọc theo participant; phiên lịch sử chưa có Bill dùng fallback Order có đánh dấu source.
      responses:
        '200': { description: 'data gồm tableName, closedAt, total, orders kèm review' }
        '401': { description: Phiên chưa đóng hoặc quyền xem hết hạn }
  /receipts/orders/{id}/review:
    post:
      summary: Đánh giá đơn đã thanh toán bằng cookie mc_receipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        '201': { description: Đã lưu đánh giá }
        '401': { description: Quyền xem hết hạn hoặc phiên chưa đóng }
        '403': { description: Đơn của thiết bị khác }
        '409': { description: Đơn đã được đánh giá }
        '422': { description: Dữ liệu không hợp lệ hoặc đơn chưa phục vụ/thanh toán }
  /auth/login:
    post:
      summary: Đăng nhập Staff/Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
        '401':
          description: Sai tài khoản/mật khẩu
  /categories:
    get:
      summary: Danh sách danh mục
      responses:
        '200': { description: OK }
  /products:
    get:
      summary: Danh sách món đang bán
      parameters:
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
      responses:
        '200': { description: OK }
  /products/featured:
    get: { summary: Món signature, responses: { '200': { description: OK } } }
  /menu/search:
    post:
      summary: Tìm menu bằng câu tiếng Việt và bộ lọc có cấu trúc
      description: |
        Chuẩn hóa không dấu/lỗi gõ nhẹ, áp dụng điều kiện cứng tại backend rồi xếp hạng menu thật.
        `dưới` là giới hạn nghiêm ngặt; `không quá`/`tối đa` là giới hạn bao gồm. Budget tính cho một món.
        Chế độ hiện tại là `fallback`; kết quả rỗng không được tự thay bằng món vi phạm điều kiện.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 200 }
                filters:
                  type: object
                  properties:
                    maxBudget: { type: integer, nullable: true, minimum: 1 }
                    noCaffeine: { type: boolean }
                    noDairy: { type: boolean }
      responses:
        '200': { description: Intent đã hiểu, mode, thông báo, latency và tối đa 12 món hợp lệ }
        '422': { description: Query hoặc bộ lọc không hợp lệ }
        '429': { description: Vượt giới hạn tần suất }
  /table-sessions/join:
    post:
      summary: Khách vào bàn bằng vé QR động còn hạn
      description: |
        Bàn chưa có phiên thì server tự mở phiên mới (`created: true`, `source: GUEST`);
        bàn đang có phiên thì đưa khách vào đúng phiên đó (`created: false`).
        Idempotent và an toàn khi nhiều request đồng thời (chỉ một phiên được tạo).
        `403` xảy ra khi QR hết hạn/bị thu hồi/không hợp lệ, phiên tạm dừng hoặc bàn chưa mở với `GUEST_AUTO_OPEN=false`.
        Token QR tĩnh và khóa cấu hình màn hình không được dùng để vào bàn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableToken]
              properties:
                tableToken: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { description: 'mc_guest và mc_receipt (HttpOnly, 12 giờ)' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      guestSessionId: { type: string }
                      participantId: { type: string }
                      tableSessionId: { type: string }
                      created: { type: boolean }
                      table:
                        type: object
                        properties:
                          id: { type: string }
                          code: { type: string }
                          name: { type: string }
                          capacity: { type: integer }
                      tableSession:
                        type: object
                        properties:
                          id: { type: string }
                          status: { type: string, enum: [OPEN, CHECKOUT, CLOSED] }
                          startedAt: { type: string, format: date-time }
        '403': { description: Chỉ khi GUEST_AUTO_OPEN=false và bàn chưa mở phiên }
        '404': { description: Token không hợp lệ hoặc bàn bị tắt }
  /table-sessions/current:
    get: { summary: Guest session hiện tại, responses: { '200': { description: OK } } }
  /table-sessions/leave:
    post: { summary: Rời bàn, responses: { '200': { description: OK } } }
  /orders:
    post:
      summary: Đặt món
      description: Cần cookie QR và quoteToken còn hạn. Chọn voucherCode và/hoặc redeemPoints nếu voucher bật allowPointRedemption; trừ voucher trước, điểm tối đa 50% phần còn lại. Thành viên xác định qua cookie mc_member, không nhận memberId/discount từ client.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, sugarLevel, iceLevel, quantity]
                    properties:
                      productId: { type: string }
                      variantId: { type: string, nullable: true }
                      sugarLevel: { type: string }
                      iceLevel: { type: string }
                      toppingIds: { type: array, items: { type: string } }
                      note: { type: string, maxLength: 280 }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
                note: { type: string, maxLength: 280 }
                quoteToken: { type: string, minLength: 20 }
                voucherCode: { type: string, minLength: 3, maxLength: 32 }
                redeemPoints: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        '201': { description: Tạo mới }
        '200': { description: Replay (idempotent) }
        '409': { description: IDEMPOTENCY_CONFLICT hoặc bàn không khả dụng }
        '422': { description: Dữ liệu không hợp lệ }
  /orders/mine:
    get:
      summary: Đơn của participant hiện tại
      description: >-
        Mỗi đơn theo guestOrderSchema (packages/contracts). Các endpoint đơn của khách
        (POST /orders, GET /orders/{id}, POST /orders/{id}/cancel) dùng cùng DTO: không trả
        idempotencyKey, requestHash, __v hay ID nhân viên trong statusHistory.
      responses: { '200': { description: OK } }
  /orders/{id}:
    get:
      summary: Chi tiết đơn (ownership)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Không thuộc participant }
  /orders/{id}/cancel:
    post:
      summary: Huỷ đơn (chỉ khi PENDING)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Không thể huỷ }
  /orders/{id}/review:
    post:
      summary: Đánh giá đơn (sau SERVED + PAID)
      description: Khách có thể đánh giá khi phiên vẫn OPEN hoặc CHECKOUT, rồi tiếp tục gọi món khi OPEN. Mỗi đơn có một đánh giá riêng, chỉ thiết bị/phiên sở hữu đơn được gửi. GET /orders/mine và /orders/{id} trả review gồm rating, comment, createdAt hoặc null; đánh giá không đóng phiên. Sau đóng phiên dùng endpoint receipt để đánh giá các đơn còn thiếu.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        '201': { description: OK }
        '403': { description: Đơn không thuộc thiết bị hoặc phiên hiện tại }
        '409': { description: Đã đánh giá }
        '422':
          { description: Đơn chưa phục vụ hoặc chưa thanh toán, hoặc rating/comment không hợp lệ }
  /service-requests:
    post:
      summary: Gửi yêu cầu (gọi nhân viên / thanh toán)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [CALL_STAFF, REQUEST_BILL, OTHER] }
                note: { type: string, maxLength: 280 }
      responses:
        '201': { description: OK }
        '409': { description: Yêu cầu đang chờ xử lý }
  /ai/recommendations:
    post:
      summary: AI gợi ý món
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 500 }
                maxBudget: { type: integer, minimum: 1 }
                preferences:
                  type: object
                  properties:
                    noCaffeine: { type: boolean }
                    noDairy: { type: boolean }
                    lowSugar: { type: boolean }
                    flavor: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [llm, fallback] }
                  message: { type: string }
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string }
                        variantId: { type: string, nullable: true }
                        reason: { type: string }
                        unitPrice: { type: integer }
                        name: { type: string }
                        image: { type: string }
        '429': { description: Rate limit }
  /staff/orders:
    get:
      summary: Đơn cho KDS
      description: >-
        Chỉ gồm đơn PAID của phiên OPEN/CHECKOUT. Mặc định lọc PENDING, CONFIRMED, PREPARING, READY;
        truyền status để lấy một trạng thái cụ thể (vẫn giới hạn trong phiên đang hoạt động).
        Mỗi phần tử theo staffOrderSchema, không có idempotencyKey/requestHash/__v.
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [PENDING, CONFIRMED, PREPARING, READY, SERVED, CANCELLED] }
      responses: { '200': { description: OK } }
  /staff/orders/{id}/status:
    patch:
      summary: Chuyển trạng thái đơn
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  { type: string, enum: [PENDING, CONFIRMED, PREPARING, READY, SERVED, CANCELLED] }
                reason: { type: string, maxLength: 280 }
      responses:
        '200': { description: OK }
        '409': { description: State transition invalid hoặc race }
  /staff/tables/{tableId}/sessions:
    post:
      summary: Khôi phục/mở phiên bàn nội bộ (không dùng trong luồng UI thông thường)
      parameters:
        - in: path
          name: tableId
