      responses:
        '200': { description: OK }
  /products/featured:
    get: { summary: Món signature, responses: { '200': { description: OK } } }
  /menu/search:
    post:
      summary: Tìm menu bằng câu tiếng Việt và bộ lọc có cấu trúc
      description: |
        Chuẩn hóa không dấu/lỗi gõ nhẹ, áp dụng điều kiện cứng tại backend rồi xếp hạng menu thật.
        `dưới` là giới hạn nghiêm ngặt; `không quá`/`tối đa` là giới hạn bao gồm. Budget tính cho một món.
        Chế độ hiện tại là `fallback`; kết quả rỗng không được tự thay bằng món vi phạm điều kiện.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 200 }
                filters:
                  type: object
                  properties:
                    maxBudget: { type: integer, nullable: true, minimum: 1 }
                    noCaffeine: { type: boolean }
                    noDairy: { type: boolean }
      responses:
        '200': { description: Intent đã hiểu, mode, thông báo, latency và tối đa 12 món hợp lệ }
        '422': { description: Query hoặc bộ lọc không hợp lệ }
        '429': { description: Vượt giới hạn tần suất }
  /table-sessions/join:
    post:
      summary: Khách vào bàn bằng vé QR động còn hạn
      description: |
        Bàn chưa có phiên thì server tự mở phiên mới (`created: true`, `source: GUEST`);
        bàn đang có phiên thì đưa khách vào đúng phiên đó (`created: false`).
        Idempotent và an toàn khi nhiều request đồng thời (chỉ một phiên được tạo).
        `403` xảy ra khi QR hết hạn/bị thu hồi/không hợp lệ, phiên tạm dừng hoặc bàn chưa mở với `GUEST_AUTO_OPEN=false`.
        Token QR tĩnh và khóa cấu hình màn hình không được dùng để vào bàn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableToken]
              properties:
                tableToken: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { description: 'mc_guest và mc_receipt (HttpOnly, 12 giờ)' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      guestSessionId: { type: string }
                      participantId: { type: string }
                      tableSessionId: { type: string }
                      created: { type: boolean }
                      table:
                        type: object
                        properties:
                          id: { type: string }
                          code: { type: string }
                          name: { type: string }
                          capacity: { type: integer }
                      tableSession:
                        type: object
                        properties:
                          id: { type: string }
                          status: { type: string, enum: [OPEN, CHECKOUT, CLOSED] }
                          startedAt: { type: string, format: date-time }
        '403': { description: Chỉ khi GUEST_AUTO_OPEN=false và bàn chưa mở phiên }
        '404': { description: Token không hợp lệ hoặc bàn bị tắt }
  /table-sessions/current:
    get: { summary: Guest session hiện tại, responses: { '200': { description: OK } } }
  /table-sessions/leave:
    post: { summary: Rời bàn, responses: { '200': { description: OK } } }
  /orders:
    post:
      summary: Đặt món
      description: Cần cookie QR và quoteToken còn hạn. Chọn voucherCode và/hoặc redeemPoints nếu voucher bật allowPointRedemption; trừ voucher trước, điểm tối đa 50% phần còn lại. Thành viên xác định qua cookie mc_member, không nhận memberId/discount từ client.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, sugarLevel, iceLevel, quantity]
                    properties:
                      productId: { type: string }
                      variantId: { type: string, nullable: true }
                      sugarLevel: { type: string }
                      iceLevel: { type: string }
                      toppingIds: { type: array, items: { type: string } }
                      note: { type: string, maxLength: 280 }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
                note: { type: string, maxLength: 280 }
                quoteToken: { type: string, minLength: 20 }
                voucherCode: { type: string, minLength: 3, maxLength: 32 }
                redeemPoints: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        '201': { description: Tạo mới }
        '200': { description: Replay (idempotent) }
        '409': { description: IDEMPOTENCY_CONFLICT hoặc bàn không khả dụng }
        '422': { description: Dữ liệu không hợp lệ }
  /orders/mine:
    get:
      summary: Đơn của participant hiện tại
      description: >-
        Mỗi đơn theo guestOrderSchema (packages/contracts). Các endpoint đơn của khách
        (POST /orders, GET /orders/{id}, POST /orders/{id}/cancel) dùng cùng DTO: không trả
        idempotencyKey, requestHash, __v hay ID nhân viên trong statusHistory.
      responses: { '200': { description: OK } }
  /orders/{id}:
    get:
      summary: Chi tiết đơn (ownership)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Không thuộc participant }
  /orders/{id}/cancel:
    post:
      summary: Huỷ đơn (chỉ khi PENDING)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Không thể huỷ }
  /orders/{id}/review:
    post:
      summary: Đánh giá đơn (sau SERVED + PAID)
      description: Khách có thể đánh giá khi phiên vẫn OPEN hoặc CHECKOUT, rồi tiếp tục gọi món khi OPEN. Mỗi đơn có một đánh giá riêng, chỉ thiết bị/phiên sở hữu đơn được gửi. GET /orders/mine và /orders/{id} trả review gồm rating, comment, createdAt hoặc null; đánh giá không đóng phiên. Sau đóng phiên dùng endpoint receipt để đánh giá các đơn còn thiếu.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        '201': { description: OK }
        '403': { description: Đơn không thuộc thiết bị hoặc phiên hiện tại }
        '409': { description: Đã đánh giá }
        '422':
          { description: Đơn chưa phục vụ hoặc chưa thanh toán, hoặc rating/comment không hợp lệ }
  /service-requests:
    post:
      summary: Gửi yêu cầu (gọi nhân viên / thanh toán)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [CALL_STAFF, REQUEST_BILL, OTHER] }
                note: { type: string, maxLength: 280 }
      responses:
        '201': { description: OK }
        '409': { description: Yêu cầu đang chờ xử lý }
  /ai/recommendations:
    post:
      summary: AI gợi ý món
      description: "Cho khách có phiên QR còn hoạt động hoặc thành viên đăng nhập qua mc_member không cần bàn. Giữ rate limit và CSRF; Cache-Control no-store. Không cấp quyền đặt đơn tại bàn cho thành viên chưa quét QR."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 500 }
                maxBudget: { type: integer, minimum: 1 }
                preferences:
                  type: object
                  properties:
                    noCaffeine: { type: boolean }
                    noDairy: { type: boolean }
                    lowSugar: { type: boolean }
                    flavor: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [llm, fallback] }
                  message: { type: string }
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string }
                        variantId: { type: string, nullable: true }
                        reason: { type: string }
                        unitPrice: { type: integer }
                        name: { type: string }
                        image: { type: string }
        '429': { description: Rate limit }
  /staff/orders:
    get:
      summary: Đơn cho KDS
      description: >-
        Chỉ gồm đơn PAID của phiên OPEN/CHECKOUT. Mặc định lọc PENDING, CONFIRMED, PREPARING, READY;
        truyền status để lấy một trạng thái cụ thể (vẫn giới hạn trong phiên đang hoạt động).
        Mỗi phần tử theo staffOrderSchema, không có idempotencyKey/requestHash/__v.
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [PENDING, CONFIRMED, PREPARING, READY, SERVED, CANCELLED] }
      responses: { '200': { description: OK } }
  /staff/orders/{id}/status:
    patch:
      summary: Chuyển trạng thái đơn
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  { type: string, enum: [PENDING, CONFIRMED, PREPARING, READY, SERVED, CANCELLED] }
                reason: { type: string, maxLength: 280 }
      responses:
        '200': { description: OK }
        '409': { description: State transition invalid hoặc race }
  /staff/tables/{tableId}/sessions:
    post:
      summary: Khôi phục/mở phiên bàn nội bộ (không dùng trong luồng UI thông thường)
      parameters:
        - in: path
          name: tableId
          required: true
          schema: { type: string }
      responses:
        '200':
          {
            description: 'data gồm { session, created }; created=false khi bàn đã có phiên (không còn 409)',
          }
  /staff/table-sessions/{id}/status:
    patch:
      summary: Đổi trạng thái phiên
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedVersion]
              properties:
                status: { type: string, enum: [OPEN, CHECKOUT, CLOSED] }
                expectedVersion: { type: integer }
      responses:
        '200': { description: OK }
        '409': { description: Phiên đã thay đổi }
  /staff/table-sessions/{id}/bill:
    get:
      {
        summary: Xem bill phiên (đọc snapshot Bill bất biến khi phiên đã CLOSED),
        responses: { '200': { description: OK } },
      }
  /staff/table-sessions/{id}/payments:
    post:
      summary: Thu tiền & đóng phiên (chốt Bill bất biến)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method, expectedVersion]
              properties:
                amount: { type: integer, minimum: 0 }
                method: { type: string, enum: [CASH, BANK_TRANSFER, OTHER] }
                expectedVersion: { type: integer }
                note: { type: string, maxLength: 280 }
      responses:
        '201': { description: 'Tạo mới — data gồm { payment, orderIds, replayed, billId }' }
        '200': { description: 'Replay — data gồm { payment, orderIds, replayed, billId }' }
  /staff/service-requests:
    get: { summary: Danh sách yêu cầu OPEN, responses: { '200': { description: OK } } }
  /staff/service-requests/{id}/resolve:
    post: { summary: Xử lý yêu cầu, responses: { '200': { description: OK } } }
  /admin/reports/overview:
    get:
      summary: KPI tổng quan
      parameters:
        - in: query
          name: from
          description: Ngày bắt đầu bao gồm, theo Asia/Ho_Chi_Minh
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Ngày kết thúc bao gồm, theo Asia/Ho_Chi_Minh
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }
  /admin/products:
    get: { summary: Danh sách món (admin), responses: { '200': { description: OK } } }
    post:
      summary: Tạo món mới
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: OK }
  /admin/products/{id}:
    patch: { summary: Cập nhật món, responses: { '200': { description: OK } } }
    delete:
      {
        summary: Xóa mềm món (giữ lịch sử và có thể khôi phục),
        responses: { '200': { description: OK } },
      }
  /admin/categories:
    get: { summary: Danh mục, responses: { '200': { description: OK } } }
    post: { summary: Tạo danh mục, responses: { '201': { description: OK } } }
  /admin/categories/{id}:
    patch:
      summary: Cập nhật danh mục; ẩn danh mục cũng ẩn món khỏi menu, tìm kiếm và AI
      responses:
        '200': { description: OK }
    delete:
      summary: Xóa danh mục trống hoặc chuyển tất cả món rồi xóa trong cùng transaction (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reassignTo:
                  type: string
                  description: ID danh mục nhận; bắt buộc nếu còn món, gồm món đã xóa mềm
      responses:
        '200':
          { description: Đã chuyển món và xóa danh mục; data.category.movedProductCount ghi số món }
        '403': { description: Chỉ ADMIN }
        '404': { description: Danh mục nguồn hoặc nhận không tồn tại }
        '409': { description: CATEGORY_NOT_EMPTY khi còn món mà chưa chọn danh mục nhận }
        '422': { description: ID không hợp lệ hoặc danh mục nhận trùng nguồn }
  /admin/toppings:
    get: { summary: Topping, responses: { '200': { description: OK } } }
    post: { summary: Tạo topping, responses: { '201': { description: OK } } }
  /admin/toppings/{id}:
    patch: { summary: Cập nhật topping, responses: { '200': { description: OK } } }
    delete:
      summary: Xóa mềm topping (ADMIN); khôi phục bằng PATCH isArchived=false
      responses:
        '200': { description: 'Ẩn topping khỏi menu và chặn giỏ cũ, giữ nguyên đơn cũ' }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không tìm thấy topping }
  /admin/tables:
    get: { summary: Danh sách bàn, responses: { '200': { description: OK } } }
  /admin/users:
    get:
      {
        summary: Danh sách tài khoản (ADMIN),
        responses: { '200': { description: Không trả passwordHash } },
      }
    post:
      summary: Tạo tài khoản STAFF hoặc ADMIN
      responses:
        '201':
          { description: 'Tài khoản mới; name, email, password 8–72 ký tự, role STAFF hoặc ADMIN' }
        '409': { description: Email đã được sử dụng }
  /admin/users/{id}:
    patch:
      summary: Sửa tài khoản hoặc đặt lại mật khẩu (ADMIN)
      description: Chỉ nhận name, email, role, isActive, password. Không tự khóa hoặc hạ quyền. Đổi quyền/trạng thái/mật khẩu thu hồi access và refresh cũ; socket bị ngắt trong tối đa 10 giây.
      responses:
        '200': { description: 'Tài khoản sau cập nhật, không trả passwordHash' }
        '403': { description: Chỉ ADMIN }
        '409': { description: Email trùng hoặc tự khóa/hạ quyền }
        '422': { description: Dữ liệu không hợp lệ }
    delete:
      summary: Xóa nhân viên (ADMIN)
      description: Chỉ xóa STAFF. Gỡ khỏi danh sách và ngừng đăng nhập; giữ bản ghi phục vụ lịch sử ca làm/khoản thu. Thu hồi access/refresh cũ; không thể mở khóa lại bằng PATCH.
      responses:
        '200': { description: Đã xóa nhân viên }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không tìm thấy nhân viên hoặc đã xóa }
        '409': { description: Không thể xóa quản trị viên }
        '422': { description: ID không hợp lệ }
  /auth/me:
    get:
      summary: Tài khoản hiện tại
      responses:
        '200': { description: 'id, name, email, role, isActive, createdAt' }
    patch:
      summary: Sửa họ tên của tài khoản hiện tại
      responses:
        '200': { description: data.user chứa thông tin đã cập nhật }
        '422': { description: 'Tên trống, quá 80 ký tự hoặc trường ngoài name' }
  /auth/password:
    post:
      summary: Đổi mật khẩu bằng currentPassword và newPassword
      description: Mật khẩu mới 8–72 ký tự, khác mật khẩu hiện tại. Thu hồi mọi phiên đăng nhập và xóa cookie; cần đăng nhập lại.
      responses:
        '200': { description: Đã đổi mật khẩu }
        '401': { description: Chưa đăng nhập }
        '422': { description: Mật khẩu hiện tại sai hoặc mật khẩu mới không hợp lệ }
  /orders/quote:
    post:
      summary: Báo giá ký số ràng buộc guest/phiên/fingerprint giỏ và thành viên/ưu đãi
      description: Body items và voucherCode và/hoặc redeemPoints. Response thêm subtotal, voucherCode, voucherDiscount, pointsDiscount, redeemedPoints, voucherAllowsPoints, maxRedeemPoints. Kiểm lại quyền kết hợp/quota/điểm khi đặt trong transaction.
      responses:
        '200': { description: Dòng món chuẩn hóa, tổng và thời hạn }
        '409': { description: Món/voucher không khả dụng hoặc không đủ điểm }
        '422': { description: Tùy chọn hoặc điều kiện ưu đãi sai }
  /orders/{id}/cancel-requests:
    post:
      {
        summary: Guest yêu cầu hủy đơn PENDING hoặc CONFIRMED trước khi pha,
        responses:
          {
            '201': { description: Đang chờ duyệt },
            '409': { description: Trạng thái không cho phép },
          },
      }
  /staff/cancel-requests:
    get: { summary: Yêu cầu hủy đang chờ, responses: { '200': { description: OK } } }
  /staff/cancel-requests/{id}:
    patch:
      {
        summary: Duyệt hoặc từ chối với expectedVersion,
        responses:
          { '200': { description: Đã xử lý }, '409': { description: Race hoặc đơn đã pha } },
      }
  /staff/catalog/availability:
    get:
      { summary: Catalog tối thiểu để staff bật/tắt bán, responses: { '200': { description: OK } } }
  /staff/catalog/products/{id}/availability:
    patch:
      {
        summary: Staff bật/tắt món nhưng không được sửa giá,
        responses: { '200': { description: Đã cập nhật } },
      }
  /staff/catalog/products/{id}/variants/{variantId}/availability:
    patch:
      {
        summary: Staff bật/tắt một size nhưng không được sửa giá,
        responses: { '200': { description: Đã cập nhật } },
      }
  /staff/catalog/toppings/{id}/availability:
    patch:
      {
        summary: Staff bật/tắt topping nhưng không được sửa giá,
        responses: { '200': { description: Đã cập nhật } },
      }
  /staff/table-sessions/{id}/transfer:
