    get:
      summary: Lịch 7 ngày, ca đang làm và hiệu suất riêng của người đăng nhập
      description: STAFF hoặc ADMIN. Giờ Việt Nam, chỉ trả lịch và báo cáo chính chủ. currentShift độc lập tuần đang xem. Không trả cấu hình/danh sách người khác.
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: 'from, until, now, shifts, currentShift, metrics, shiftMetrics; staff/coverage rỗng với Staff' }
        '401': { description: Cần đăng nhập }
        '422': { description: Ngày hoặc query không hợp lệ }
  /staff/workforce/{id}/clock-in:
    post:
      summary: Chính chủ vào ca bằng giờ server, sớm tối đa 30 phút
      description: 'Body strict {expectedVersion}. Chỉ SCHEDULED, chưa hết ca và không trùng giờ thực tế; retry không ghi hai lần. Không cho truyền giờ hoặc staffId.'
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: WorkShift DTO }
        '403': { description: Ca của người khác hoặc tài khoản không hoạt động }
        '409': { description: Ca đổi version, ngoài cửa sổ chấm hoặc chồng lấn giờ thực tế }
  /staff/workforce/{id}/clock-out:
    post:
      summary: Chính chủ ra ca bằng giờ server
      description: 'Body strict {expectedVersion}. Chỉ WORKING, retry không ghi hai lần. Ca mở quá 24 giờ phải được Admin điều chỉnh.'
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: WorkShift DTO }
        '403': { description: Không phải chính chủ }
        '409': { description: Version hoặc trạng thái không hợp lệ, hoặc cần điều chỉnh giờ }
  /admin/workforce:
    get:
      summary: Admin xem lịch, chấm công, hiệu suất toàn bộ và cảnh báo thiếu người
      description: '7 ngày từ from, UTC+7. coverage lấy mức phủ đồng thời thấp nhất. metrics/shiftMetrics theo người/công đoạn và snapshot ca, có số mẫu. peaks dùng 4 tuần hoàn chỉnh trước min(tuần được chọn, hôm nay), từ 20 đơn PAID không hủy; khung cần 3 mẫu, tối đa 12 khung; trung bình chia 4 tuần kể cả tuần 0 đơn, đề xuất ceil(TB/định mức). cash chứa 50 ca gần nhất (ưu tiên OPEN) mở/chốt trong tuần hoặc đang OPEN, tổng chênh lệch trên mọi ca CLOSED theo closedAt trong tuần. Staff không nhận peaks/cash. Không backfill KDS cũ, không gán chênh lệch tiền cho nhân viên.'
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: 'from, until, now, shifts, currentShift, staff, policy, coverage, metrics, shiftMetrics, peaks, cash' }
        '403': { description: Chỉ Admin }
        '422': { description: Ngày không hợp lệ }
  /admin/workforce/shifts:
    post:
      summary: Admin xếp ca cho một tài khoản hoạt động
      description: 'Body strict {staffId,label,startsAt,endsAt,note?,requestId}. Timestamp ISO có timezone, ca >0 đến 16h, chưa kết thúc; UUID requestId chống tạo trùng và kiểm hash payload. Chống xếp chồng cả khi nhiều Admin thao tác đồng thời.'
      responses:
        '200': { description: WorkShift DTO hoặc replay }
        '403': { description: Chỉ Admin, nhân viên phải hoạt động }
        '409': { description: Trùng ca hoặc requestId đã dùng cho dữ liệu khác }
        '422': { description: Payload hoặc thời gian không hợp lệ }
  /admin/workforce/shifts/{id}:
    patch:
      summary: Admin sửa lịch chưa chấm công
      description: 'Body strict {staffId,label,startsAt,endsAt,note?,expectedVersion}. Khóa lịch sau khi vào ca; kiểm chồng lấn với lịch khác.'
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: WorkShift DTO }
        '409': { description: Ca đã đổi, đã chấm/hủy hoặc trùng lịch }
  /admin/workforce/shifts/{id}/cancel:
    post:
      summary: Admin hủy ca chưa chấm với lý do, không xóa lịch sử
      description: 'Body strict {expectedVersion,reason}; reason 3–500 ký tự. Cho phép hủy lịch tài khoản đã khóa/xóa.'
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: WorkShift DTO }
        '409': { description: Ca đã chấm hoặc version cũ }
  /admin/workforce/shifts/{id}/attendance:
    post:
      summary: Admin bổ sung hoặc điều chỉnh giờ thực tế, giữ giờ bấm gốc
      description: 'Body strict {expectedVersion,startsAt,endsAt,reason}. >0 đến 24h, không ở tương lai, trong 12h quanh lịch, không trùng chấm công khác. Ghi audit before/after và người sửa cùng transaction. Không gán lại snapshot KDS.'
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: WorkShift DTO }
        '409': { description: Ca hủy, version cũ hoặc chồng lấn giờ thực tế }
        '422': { description: Thiếu lý do hoặc khoảng giờ không hợp lệ }
  /admin/workforce/policy:
    put:
      summary: Admin thay danh sách khung nhu cầu nhân sự có version và audit
      description: 'Body strict {expectedVersion,rules:[{day,startMinute,endMinute,minStaff,label}],ordersPerStaffHour?}; định mức nguyên 1–100, mặc định 6, dùng cho đề xuất lịch sử. Tối đa 100 khung, day 1=thứ hai đến 7=chủ nhật; phút 0–1440, minStaff 1–50; khung cùng ngày không chồng nhau. rules rỗng tắt cảnh báo. Gợi ý chỉ vào bản nháp khi Admin chọn, bấm Lưu mới đổi cấu hình. Version được giữ từ lúc mở form.'
      responses:
        '200': { description: version và rules đã lưu }
        '409': { description: Cấu hình vừa được người khác thay đổi }
        '422': { description: Khung chồng lấn hoặc payload không hợp lệ }
  /members/register:
    post:
      summary: Đăng ký thành viên bằng tên, SĐT Việt Nam và mật khẩu; không SMS
      description: Body strict gồm name, phone, password. Mật khẩu từ 8 ký tự, tối đa 72 byte UTF-8. Set cookie HttpOnly mc_member 14 ngày, JSON không trả token/hash.
      responses:
        '201': { description: DTO member }
        '409': { description: SĐT đã đăng ký }
        '422': { description: Input không hợp lệ }
  /members/login:
    post:
      summary: Đăng nhập SĐT + mật khẩu, set cookie HttpOnly mc_member
      description: Body gồm phone, password. Chuẩn hóa +84 thành 0. Sáu lần sai khóa 15 phút; thêm Redis limiter theo IP.
      responses:
        '200': { description: DTO member }
        '401': { description: Sai thông tin hoặc tài khoản khóa }
        '429': { description: Khóa đăng nhập tạm thời hoặc rate limit }
  /members/me:
    get:
      summary: Thành viên hiện tại hoặc null và quy tắc tích/đổi điểm
      responses:
        '200': { description: member và rules }
  /members/logout:
    post:
      summary: Thu hồi phiên thành viên hiện tại và xóa cookie
      responses:
        '200': { description: OK }
  /members/password:
    post:
      summary: Đổi mật khẩu thành viên và thu hồi mọi phiên
      description: Body strict gồm currentPassword và password mới.
      responses:
        '200': { description: Đã đổi; cần đăng nhập lại }
        '401': { description: Chưa đăng nhập hoặc sai mật khẩu hiện tại }
  /members/points:
    get:
      summary: Cookie thành viên hợp lệ xem sổ điểm của chính mình; page mặc định 1, 20 dòng/trang
      responses:
        '200': { description: items, total, page; EARN/REDEEM/RETURN và balanceAfter }
        '401': { description: Cần đăng nhập thành viên }
  /admin/vouchers:
    get:
      summary: ADMIN xem 200 voucher mới nhất kèm số lượt đang giữ/đã dùng
      responses:
        '200': { description: items }
    post:
      summary: ADMIN tạo voucher FIXED/PERCENT
      description: Cấu hình strict theo voucherCreateSchema trong packages/contracts/src/promotions.ts; không tự tạo dữ liệu mẫu. Có mức đơn tối thiểu, trần giảm, thời gian, tổng lượt, điều kiện và lượt thành viên. allowPointRedemption (boolean, mặc định false) bật quyền dùng kèm điểm; giới hạn điểm tính sau voucher.
      responses:
        '201': { description: voucher DTO }
        '409': { description: Mã trùng }
  /admin/vouchers/{id}:
    patch:
      summary: ADMIN sửa cấu hình voucher với expectedVersion; không đổi mã
      responses:
        '200': { description: voucher DTO }
        '409': { description: Version đã đổi }
  /admin/members:
    get:
      summary: ADMIN tìm theo q là tên/SĐT, phân trang page, 20 dòng/trang
      responses:
        '200': { description: items, total, page; không có passwordHash/token }
  /admin/members/{id}:
    patch:
      summary: ADMIN khóa/mở/đặt lại mật khẩu thành viên, thu hồi phiên
      description: Body strict gồm expectedVersion, isActive và/hoặc password mới; không được sửa điểm.
      responses:
        '200': { description: member DTO }
        '409': { description: Version đã đổi }
  /admin/members/{id}/points:
    get:
      summary: ADMIN xem sổ điểm thành viên theo page
      responses:
        '200': { description: items, total, page }
  /admin/inventory:
    get:
      summary: ADMIN xem nguyên liệu, tồn thực, lượng giữ, cảnh báo và công thức
      responses:
        '200': { description: data gồm ingredients, recipes, products và toppings }
        '401': { description: Chưa đăng nhập }
        '403': { description: Chỉ ADMIN }
  /admin/inventory/ingredients:
    post:
      summary: ADMIN thêm nguyên liệu với tồn ban đầu bằng 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, unit]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9_-]{1,32}$' }
                name: { type: string, minLength: 1, maxLength: 100 }
                unit: { type: string, enum: [g, ml, unit] }
                lowStockThreshold:
                  { type: number, minimum: 0, maximum: 1000000000, multipleOf: 0.001, default: 0 }
      responses:
        '201': { description: data.ingredient với lượng theo đơn vị cơ sở }
        '403': { description: Chỉ ADMIN }
        '409': { description: Mã nguyên liệu đã tồn tại }
        '422': { description: Dữ liệu không hợp lệ }
  /admin/inventory/ingredients/{id}:
    patch:
      summary: ADMIN sửa tên, ngưỡng cảnh báo hoặc ngừng dùng nguyên liệu
      description: Không đổi mã/đơn vị; không ngừng nguyên liệu đang giữ cho đơn.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, lowStockThreshold, isActive, expectedVersion]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                lowStockThreshold:
                  { type: number, minimum: 0, maximum: 1000000000, multipleOf: 0.001 }
                isActive: { type: boolean }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200': { description: data.ingredient }
        '403': { description: Chỉ ADMIN }
        '409': { description: Version thay đổi hoặc còn nguyên liệu đang giữ }
        '422': { description: Dữ liệu không hợp lệ }
  /admin/inventory/ingredients/{id}/movements:
    post:
      summary: ADMIN ghi nhận nhập, xuất khác hoặc kiểm kê có lý do và chống ghi trùng
      description: Quantity theo g/ml/đơn vị; ADJUSTMENT là tổng tồn sau kiểm kê. Không được thấp hơn lượng đang giữ. Retry giữ nguyên idempotencyKey và nội dung, không yêu cầu version cũ còn khớp nếu đã ghi nhận.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, quantity, reason, expectedVersion, idempotencyKey]
              properties:
                type: { type: string, enum: [RECEIPT, ISSUE, ADJUSTMENT] }
                quantity: { type: number, minimum: 0, maximum: 1000000000, multipleOf: 0.001 }
                reason: { type: string, minLength: 3, maxLength: 280 }
                expectedVersion: { type: integer, minimum: 0 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '200': { description: data.id và data.replayed }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không có nguyên liệu }
        '409': { description: Version đổi, thiếu tồn hoặc key dùng cho nội dung khác }
        '422': { description: Dữ liệu không hợp lệ }
  /admin/inventory/movements:
    get:
      summary: ADMIN xem sổ biến động kho phân trang 30 dòng
      parameters:
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, maximum: 100000, default: 1 },
          }
        - { in: query, name: ingredientId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200':
          {
            description: data.items,
            total,
            page và limit; có lượng biến động,
            tồn sau,
            giữ sau,
            lý do,
            đơn và người thao tác,
          }
        '403': { description: Chỉ ADMIN }
  /admin/inventory/recipes/{type}/{id}:
    put:
      summary: ADMIN lưu công thức nền và công thức thay thế theo size
      description: Xem docs/inventory.md và recipeSaveSchema trong contracts. Payload gồm enabled, components, variants và expectedVersion. Component gồm ingredientId và quantity lớn hơn 0, tối đa 3 chữ số thập phân. Topping không có variants. Công thức bật cần ít nhất một nguyên liệu nền; không cho trùng nguyên liệu/size. Không sửa snapshot kho của đơn đã đặt.
      parameters:
        - {
            in: path,
            name: type,
            required: true,
            schema: { type: string, enum: [PRODUCT, TOPPING] },
          }
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, components, variants, expectedVersion]
              properties:
                enabled: { type: boolean }
                expectedVersion: { type: integer, minimum: 0 }
                components:
                  type: array
                  maxItems: 100
                  items: &inventoryComponent
                    type: object
                    additionalProperties: false
                    required: [ingredientId, quantity]
                    properties:
                      ingredientId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                      quantity:
                        {
                          type: number,
                          minimum: 0,
                          exclusiveMinimum: true,
                          maximum: 1000000000,
                          multipleOf: 0.001,
                        }
                variants:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, components]
                    properties:
                      variantId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                      components:
                        { type: array, minItems: 1, maxItems: 100, items: *inventoryComponent }
      responses:
        '200': { description: data.version mới }
        '403': { description: Chỉ ADMIN }
        '404': { description: Món/topping không tồn tại hoặc đã xóa }
        '409': { description: Version công thức đã đổi }
        '422': { description: Nguyên liệu hoặc size không hợp lệ }
  /table-displays/qr:
    get:
      summary: Lấy QR vào bàn còn hạn trong chu kỳ 60 giây
      description: Thiết bị tại bàn dùng khóa riêng. Trả data gồm tableId, tableName, url, expiresAt và serverTime (milliseconds); Cache-Control no-store. Khóa màn hình không phải vé vào bàn.
      parameters:
        - in: header
          name: X-Table-Display-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: QR có chữ ký và thời hạn }
        '403': { description: Khóa không hợp lệ hoặc đã thu hồi }
  /staff/tables/{id}/display:
    post:
      summary: STAFF hoặc ADMIN cấp lại liên kết riêng cho màn hình QR
      description: Thu hồi khóa màn hình và QR cũ ngay; giữ quyền khách đã tham gia phiên.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: data chứa tableId và url /display với khóa trong fragment }
        '403': { description: Không đủ quyền }
  /admin/tables/{id}/display:
    post:
      summary: ADMIN cấp lại liên kết riêng cho màn hình QR
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: data chứa tableId và url cấu hình màn hình }
        '403': { description: Chỉ ADMIN }
  /staff/awaiting-payments:
