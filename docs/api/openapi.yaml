                expectedVersion: { type: integer, minimum: 0 }
                approve: { type: boolean }
                note: { type: string, minLength: 3, maxLength: 280 }
      responses:
        '200': { description: Đã xử lý và ghi audit; duyệt ghi đảo/thay thế trong transaction }
        '403': { description: Người lập không tự duyệt; chỉ ADMIN được quyết định }
        '409': { description: Yêu cầu đã xử lý hoặc trạng thái khoản thu/đơn đã thay đổi }
  /staff/orders/{id}/refund:
    post:
      summary: Ghi nhận đã hoàn đủ tiền thủ công và hủy đơn chưa pha chế
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
